name: Cross-language protobuf contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install Python SDK with test dependencies
        run: python -m pip install -e './python[dev]'
      - name: Install TypeScript SDK dependencies
        working-directory: typescript
        run: npm ci
      - name: Python golden-wire checks
        run: python -m pytest -q python/tests/test_contract.py
      - name: TypeScript golden-wire checks
        working-directory: typescript
        run: npx jest --runInBand tests/contract.test.ts
